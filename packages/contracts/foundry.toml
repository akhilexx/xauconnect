# Foundry profile (provisioned for fuzz/invariant testing once forge is installed).
# Run: curl -L https://foundry.paradigm.xyz | bash && foundryup
[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules"]
test = "test/foundry"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512
