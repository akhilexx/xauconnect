# apps/mobile is intentionally NOT part of the pnpm workspace:
# Expo/React Native manages its own dependency tree (see apps/mobile/README.md).
packages:
  - "apps/web"
  - "packages/*"
  - "backend"

# pnpm 10 reads the build-script allowlist from here (not package.json).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - sharp
  - keccak
  - secp256k1
  - bufferutil
  - utf-8-validate

# Patched versions within the majors used by the production dependency tree.
overrides:
  "axios@>=1 <1.20.0": "^1.20.0"
  "body-parser@>=1 <1.20.9": "^1.20.9"
  "browserslist@>=4 <4.28.7": "^4.28.7"
  "effect@>=3 <3.22.1": "^3.22.1"
  "follow-redirects@>=1 <1.16.2": "^1.16.2"
  "form-data@>=4 <4.0.6": "^4.0.6"
  "lodash@>=4 <4.18.0": "^4.18.0"
  "nanoid@>=3 <3.3.18": "^3.3.18"
  "postcss@>=8 <8.5.18": "^8.5.18"
  "protobufjs@>=7 <7.6.1": "^7.6.1"
  "proxy-addr@>=2 <2.0.8": "^2.0.8"
  "shell-quote@>=1 <1.11.0": "^1.11.0"
  "socket.io-parser@>=4 <4.2.7": "^4.2.7"
  "source-map-js@>=1 <1.2.2": "^1.2.2"
  "ws@>=8 <8.21.0": "^8.21.0"
